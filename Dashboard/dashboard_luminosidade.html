<style>
  :root {
    --bg:        #f3eeff;
    --surface:   #ffffffdd;
    --title:     #3b1f6e;
    --line:      #5c2fa8;
    --accent:    #7c3aed;
    --mean:      #c4b5fd;
    --mean-lbl:  #4c1d95;
    --border:    #ddd6fe;
    --text:      #2e1065;
    --subtext:   #6d28d9;
    --shadow:    0 4px 24px #7c3aed22;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    padding: 2rem 1.5rem 3rem;
    color: var(--text);
  }

  /* subtle radial glow in the background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 70% 50% at 50% 0%, #c4b5fd44 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .wrapper { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }
  header h1 {
    font-size: 2rem;
    font-weight: 800;
    color: var(--title);
    letter-spacing: -0.5px;
  }
  header p {
    margin-top: .4rem;
    font-family: 'Nunito Sans', sans-serif;
    color: var(--subtext);
    font-size: .95rem;
  }

  .badge {
    display: inline-block;
    margin-top: .8rem;
    background: var(--line);
    color: #fff;
    font-size: .75rem;
    font-weight: 700;
    padding: .25rem .75rem;
    border-radius: 999px;
    letter-spacing: .5px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.75rem;
  }

  .card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 18px;
    padding: 1.5rem 1.75rem 1.75rem;
    box-shadow: var(--shadow);
    backdrop-filter: blur(6px);
  }

  .card-header {
    display: flex;
    align-items: baseline;
    gap: .75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .card-header h2 {
    font-size: 1.1rem;
    font-weight: 800;
    color: var(--title);
  }
  .card-header .chip {
    font-size: .72rem;
    font-weight: 700;
    color: var(--accent);
    background: #ede9fe;
    border-radius: 999px;
    padding: .18rem .6rem;
  }
  .stat {
    font-family: 'Nunito Sans', sans-serif;
    font-size: .82rem;
    color: var(--subtext);
    margin-left: auto;
  }
  .stat span {
    font-weight: 700;
    color: var(--mean-lbl);
  }

  .chart-wrap { position: relative; height: 260px; }

  /* empty state */
  .empty {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--subtext);
    font-size: .9rem;
    opacity: .6;
  }

  footer {
    text-align: center;
    margin-top: 2.5rem;
    font-size: .8rem;
    color: #a78bfa99;
    font-family: 'Nunito Sans', sans-serif;
  }
</style>
</head>

    </div>

      </div>
      <div class="chart-wrap" id="wrap-1m">

    </div>

</div>

// ── Helpers ───────────────────────────────────────────────────────────────────
function formatTime(iso) {
  // Trata timestamps UTC (pode ter 'Z' ou não)
  const s = iso.endsWith('Z') ? iso : iso + 'Z';
  const d = new Date(s);
  if (isNaN(d)) return iso.slice(11,19); // fallback: HH:MM:SS
  return d.toLocaleString('pt-BR', {
    day: '2-digit', month: '2-digit',
    hour: '2-digit', minute: '2-digit', second: '2-digit',
    timeZone: 'America/Sao_Paulo'
  });
}

function media(arr) {
  if (!arr.length) return null;
  return arr.reduce((a, b) => a + b, 0) / arr.length;
}

// ── Paleta ────────────────────────────────────────────────────────────────────
const LINE_COLOR   = '#5c2fa8';
const FILL_COLOR   = '#7c3aed18';
const MARKER_COLOR = '#5c2fa8';
const MEAN_COLOR   = '#9333ea';
const MEAN_BG      = '#f5f3ff';

// ── Fábrica de gráficos ───────────────────────────────────────────────────────
function buildChart(canvasId, wrapId, data, statId) {
  const wrap = document.getElementById(wrapId);

  if (!data || data.length === 0) {
    const canvas = document.getElementById(canvasId);
    canvas.style.display = 'none';
    const empty = document.createElement('div');
    empty.className = 'empty';
    empty.textContent = 'Sem dados nesse intervalo de tempo.';
    wrap.appendChild(empty);
    return;
  }

  const labels = data.map(d => formatTime(d.recvTime));
  const values = data.map(d => d.attrValue);
  const avg    = media(values);

  // Atualiza stat
  const statEl = document.querySelector(`#${statId} span`);
  if (statEl) statEl.textContent = avg !== null ? avg.toFixed(1) : '–';

  // Reduz labels no eixo X se muitos pontos
  const maxLabels = 10;
  const step = Math.ceil(labels.length / maxLabels);
  const sparseLabels = labels.map((l, i) => (i % step === 0 ? l : ''));

  new Chart(document.getElementById(canvasId), {
    type: 'line',
    data: {
      labels: sparseLabels,
      datasets: [{
        label: 'Luminosidade',
        data: values,
        borderColor: LINE_COLOR,
        backgroundColor: FILL_COLOR,
        pointBackgroundColor: MARKER_COLOR,
        pointBorderColor: '#fff',
        pointBorderWidth: 1.5,
        pointRadius: values.length > 40 ? 2 : 5,
        pointHoverRadius: 7,
        borderWidth: 2.5,
        tension: 0.35,
        fill: true,
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: '#3b1f6e',
          titleColor: '#e9d5ff',
          bodyColor: '#fff',
          titleFont: { family: 'Nunito', weight: '700' },
          bodyFont: { family: 'Nunito Sans' },
          padding: 10,
          callbacks: {
            title: (items) => labels[items[0].dataIndex],  // tooltip mostra label completo
            label: (item) => ` Luminosidade: ${item.raw.toFixed(1)}`
          }
        },
        annotation: avg !== null ? {
          annotations: {
            meanLine: {
              type: 'line',
              yMin: avg,
              yMax: avg,
              borderColor: MEAN_COLOR,
              borderWidth: 2,
              borderDash: [6, 4],
              label: {
                display: true,
                content: `Média: ${avg.toFixed(1)}`,
                position: 'end',
                backgroundColor: MEAN_COLOR,
                color: '#fff',
                font: { family: 'Nunito', weight: '700', size: 12 },
                padding: { x: 8, y: 4 },
                borderRadius: 6,
              }
            }
          }
        } : {}
      },
      scales: {
        x: {
          grid: { color: '#ede9fe88' },
          ticks: {
            color: '#6d28d9',
            font: { family: 'Nunito', weight: '700', size: 11 },
            maxRotation: 40,
            minRotation: 20,
          }
        },
        y: {
          grid: { color: '#ede9fe88' },
          ticks: {
            color: '#6d28d9',
            font: { family: 'Nunito', weight: '700', size: 11 },
          },
          title: {
            display: true,
            text: 'Luminosidade',
            color: '#3b1f6e',
            font: { family: 'Nunito', weight: '800', size: 12 }
          }
        }
      }
    }
  });
}
